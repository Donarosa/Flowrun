<meta charset="UTF-8">

<title>Banco Informativo — Trail Run & Running</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  .header-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 0.75rem; }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; color: var(--text); margin-bottom: 0.75rem; }
  h1 em { color: var(--accent); font-style: italic; }
  .subtitle { color: var(--muted); font-size: 15px; max-width: 560px; }
  
  .controls { padding: 1.5rem 2rem; max-width: 960px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filter-btn { background: white; border: 1px solid var(--border); border-radius: 100px; padding: 6px 16px; font-size: 13px; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input { background: white; border: 1px solid var(--border); border-radius: 100px; padding: 6px 16px 6px 36px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); width: 200px; outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; padding: 1rem 2rem 3rem; max-width: 960px; margin: 0 auto; }
  
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }

  .card-num { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 0.75rem; font-weight: 500; }
  .card h2 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; line-height: 1.25; margin-bottom: 0.5rem; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .tag { background: var(--tag-bg); color: var(--tag-text); font-size: 11px; padding: 3px 10px; border-radius: 100px; font-weight: 500; letter-spacing: 0.03em; }
  .tag.trail { background: rgba(212,98,42,0.08); color: #7A2E0A; }
  .tag.ruta { background: rgba(43,76,140,0.08); color: #1A2E5C; }
  .card-preview { font-size: 13px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-accent { position: absolute; top: 0; right: 0; width: 4px; height: 100%; }
  .cat-fisiologia .card-accent { background: var(--accent); }
  .cat-tecnica .card-accent { background: var(--accent2); }
  .cat-nutricion .card-accent { background: #E9A820; }
  .cat-mental .card-accent { background: var(--accent3); }
  .cat-recuperacion .card-accent { background: #7B5EA7; }

  .overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal { background: var(--card); border-radius: 20px; max-width: 680px; width: 100%; padding: 2.5rem; position: relative; margin: auto; }
  .modal-close { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 18px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .modal-num { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .modal h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; line-height: 1.2; margin-bottom: 0.75rem; }
  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .modal-section { margin-bottom: 1.5rem; }
  .modal-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 500; margin-bottom: 0.6rem; }
  .modal-section p { font-size: 14px; color: var(--text); line-height: 1.75; }
  .modal-section ul { padding-left: 1.25rem; }
  .modal-section ul li { font-size: 14px; color: var(--text); line-height: 1.75; margin-bottom: 0.25rem; }
  .fact-box { background: #F0F7F4; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .fact-box .fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 500; margin-bottom: 0.3rem; }
  .fact-box p { font-size: 14px; color: #1A4433; line-height: 1.6; font-style: italic; }
  .sources { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.5rem; }
  .copy-btn { background: var(--accent); color: white; border: none; border-radius: 100px; padding: 10px 22px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 1rem; font-weight: 500; }
  .copy-btn:hover { background: #1A4433; }

  #count { font-size: 13px; color: var(--muted); padding: 0 2rem; max-width: 960px; margin: 0 auto 0.5rem; }
  .hidden { display: none !important; }
</style>
</head>

let activeFilter = "all";
let searchTerm = "";

function renderCards() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const filtered = banco.filter(t => {
    const matchCat = activeFilter === "all" || t.cat === activeFilter;
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || t.title.toLowerCase().includes(q) || t.tags.some(tag => tag.toLowerCase().includes(q)) || t.preview.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  document.getElementById("count").textContent = filtered.length + " temas";
  filtered.forEach(t => {
    const card = document.createElement("div");
    card.className = `card cat-${t.cat}`;
    card.innerHTML = `
      <div class="card-accent"></div>
      <div class="card-num">N° ${t.id}</div>
      <h2>${t.title}</h2>
      <div class="card-tags">${t.tags.map(tag => `<span class="tag ${tag==='Trail'?'trail':tag==='Ruta'?'ruta':''}">${tag}</span>`).join("")}</div>
      <p class="card-preview">${t.preview}</p>
    `;
    card.onclick = () => openModal(t);
    grid.appendChild(card);
  });
}

function openModal(t) {
  const content = document.getElementById("modal-content");
  content.innerHTML = `
    <div class="modal-num">N° ${t.id} · ${t.cat.charAt(0).toUpperCase()+t.cat.slice(1)}</div>
    <h2>${t.title}</h2>
    <div class="modal-tags">${t.tags.map(tag => `<span class="tag ${tag==='Trail'?'trail':tag==='Ruta'?'ruta':''}">${tag}</span>`).join("")}</div>
    <div class="fact-box">
      <div class="fact-label">Dato clave</div>
      <p>${t.fact}</p>
    </div>
    <div class="modal-section">
      <h3>Base científica</h3>
      <p>${t.ciencia}</p>
    </div>
    <div class="modal-section">
      <h3>Aplicación práctica</h3>
      <ul>${t.aplicacion.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>
    <div class="sources">📚 Fuentes: ${t.fuentes}</div>
  `;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("modal").dataset.title = t.title;
  document.getElementById("modal").dataset.content = JSON.stringify(t);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
}

function copyContent() {
  const t = JSON.parse(document.getElementById("modal").dataset.content);
  const text = `TEMA: ${t.title}\n\nDATO CLAVE:\n${t.fact}\n\nCIENCIA:\n${t.ciencia}\n\nAPLICACIÓN PRÁCTICA:\n${t.aplicacion.map((a,i) => `${i+1}. ${a}`).join("\n")}\n\nFUENTES: ${t.fuentes}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(".copy-btn");
    btn.textContent = "¡Copiado!";
    setTimeout(() => btn.textContent = "Copiar contenido para generar plaza ↗", 2000);
  });
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.cat;
    renderCards();
  };
});

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderCards();
});

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("overlay")) closeModal();
});

renderCards();
</script>
